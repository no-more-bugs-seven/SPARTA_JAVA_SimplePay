name: CI/CD Pipeline

# main 브랜치 push 또는 PR
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# OIDC 토큰 요청 권한
permissions:
  id-token: write   # OIDC 토큰 요청용
  contents: read    # 코드 체크아웃용 (체크아웃 - Repo에 있는 코드를 Runner에 옮김)

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      # Step 1: 코드 가져오기
      - name: Checkout code
        uses: actions/checkout@v6

      # Step 2: 커밋 해시 추출
      - name: Set short SHA
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      # Step 3: Java 17 설치
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'corretto'

      # Step 4: Gradle 캐시
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Chmod gradlew
        run: chmod +x gradlew

      # Step 5: 테스트 실행
      - name: Run tests
        run: ./gradlew test

      # Step 6: JAR 빌드
      - name: Build JAR
        run: ./gradlew bootJar

      # Step 7: AWS 자격증명 - OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 8: ECR 로그인
      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      # Step 9: Docker 빌드 및 push
      - name: Build and push Docker image
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/${{ vars.ECR_REPOSITORY }}

          # Docker 빌드
          docker build --platform linux/arm64 -t $IMAGE_URI:$SHORT_SHA .
          
          # ECR push
          docker push $IMAGE_URI:$SHORT_SHA
          
          # 결과 출력
          echo "✅ Pushed: $IMAGE_URI:$SHORT_SHA"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'   # main push에서만 배포 (PR에서는 CI만 실행)
    runs-on: ubuntu-latest

    steps:
      # Step 1: AWS 자격증명 - OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Step 2: Launch Template 새 버전 생성 (User Data의 IMAGE_TAG를 새 커밋 SHA로 교체)
      - name: Update Launch Template
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          LAUNCH_TEMPLATE_ID: ${{ vars.LAUNCH_TEMPLATE_ID }}
          DATABASE_URL: ${{ vars.DATABASE_URL }}
          DATABASE_USERNAME: ${{ vars.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ vars.DATABASE_PASSWORD }}
          JWT_SECRET_KEY: ${{ vars.JWT_SECRET_KEY }}
          JWT_ACCESS_TOKEN_VALIDITY_TIME: ${{ vars.JWT_ACCESS_TOKEN_VALIDITY_TIME }}
          JWT_REFRESH_TOKEN_VALIDITY_TIME: ${{ vars.JWT_REFRESH_TOKEN_VALIDITY_TIME }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          REDIS_HOST: ${{ vars.REDIS_HOST }}
          REDIS_PORT: ${{ vars.REDIS_PORT }}
          REDIS_USERNAME: ${{ vars.REDIS_USERNAME }}
          REDIS_PASSWORD: ${{ vars.REDIS_PASSWORD }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ vars.GOOGLE_CLIENT_SECRET }}
          PORTONE_API_SECRET: ${{ vars.PORTONE_API_SECRET }}
          PORTONE_STORE_ID: ${{ vars.PORTONE_STORE_ID }}
          PORTONE_CHANNEL_KG: ${{ vars.PORTONE_CHANNEL_KG }}
          PORTONE_CHANNEL_TOSS: ${{ vars.PORTONE_CHANNEL_TOSS }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"

          USER_DATA=$(cat <<USERDATA | sed "
          s|__IMAGE_TAG__|${IMAGE_TAG}|g;
          s|__AWS_ACCOUNT_ID__|${AWS_ACCOUNT_ID}|g;
          s|__AWS_REGION__|${AWS_REGION}|g;
          s|__ECR_REPOSITORY__|${ECR_REPOSITORY}|g;
          s|__DATABASE_URL__|${DATABASE_URL}|g;
          s|__DATABASE_USERNAME__|${DATABASE_USERNAME}|g;
          s|__DATABASE_PASSWORD__|${DATABASE_PASSWORD}|g;
          s|__JWT_SECRET_KEY__|${JWT_SECRET_KEY}|g;
          s|__JWT_ACCESS_TOKEN_VALIDITY_TIME__|${JWT_ACCESS_TOKEN_VALIDITY_TIME}|g;
          s|__JWT_REFRESH_TOKEN_VALIDITY_TIME__|${JWT_REFRESH_TOKEN_VALIDITY_TIME}|g;
          s|__SERVER_PORT__|${SERVER_PORT}|g;
          s|__REDIS_HOST__|${REDIS_HOST}|g;
          s|__REDIS_PORT__|${REDIS_PORT}|g;
          s|__REDIS_USERNAME__|${REDIS_USERNAME}|g;
          s|__REDIS_PASSWORD__|${REDIS_PASSWORD}|g;
          s|__GOOGLE_CLIENT_ID__|${GOOGLE_CLIENT_ID}|g;
          s|__GOOGLE_CLIENT_SECRET__|${GOOGLE_CLIENT_SECRET}|g;
          s|__PORTONE_API_SECRET__|${PORTONE_API_SECRET}|g;
          s|__PORTONE_STORE_ID__|${PORTONE_STORE_ID}|g;
          s|__PORTONE_CHANNEL_KG__|${PORTONE_CHANNEL_KG}|g;
          s|__PORTONE_CHANNEL_TOSS__|${PORTONE_CHANNEL_TOSS}|g;
          s|__BASE_URL__|${BASE_URL}|g
          " | base64 -w 0
          #!/bin/bash
          set -e
          AWS_REGION="__AWS_REGION__"
          AWS_ACCOUNT_ID="__AWS_ACCOUNT_ID__"
          ECR_REPOSITORY="__ECR_REPOSITORY__"
          IMAGE_TAG="__IMAGE_TAG__"
          ECR_URI="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}"
          
          DATABASE_URL="__DATABASE_URL__"
          DATABASE_USERNAME="__DATABASE_USERNAME__"
          DATABASE_PASSWORD="__DATABASE_PASSWORD__"
          
          JWT_SECRET_KEY="__JWT_SECRET_KEY__"
          JWT_ACCESS_TOKEN_VALIDITY_TIME="__JWT_ACCESS_TOKEN_VALIDITY_TIME__"
          JWT_REFRESH_TOKEN_VALIDITY_TIME="__JWT_REFRESH_TOKEN_VALIDITY_TIME__"
          
          SERVER_PORT="__SERVER_PORT__"
          
          REDIS_HOST="__REDIS_HOST__"
          REDIS_PORT="__REDIS_PORT__"
          REDIS_USERNAME="__REDIS_USERNAME__"
          REDIS_PASSWORD="__REDIS_PASSWORD__"
          
          GOOGLE_CLIENT_ID="__GOOGLE_CLIENT_ID__"
          GOOGLE_CLIENT_SECRET="__GOOGLE_CLIENT_SECRET__"
          
          PORTONE_API_SECRET="__PORTONE_API_SECRET__"
          PORTONE_STORE_ID="__PORTONE_STORE_ID__"
          PORTONE_CHANNEL_KG="__PORTONE_CHANNEL_KG__"
          PORTONE_CHANNEL_TOSS="__PORTONE_CHANNEL_TOSS__"
          BASE_URL="__BASE_URL__"
  
          dnf update -y
          dnf install -y docker
          systemctl enable docker
          systemctl start docker
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
          docker pull ${ECR_URI}:${IMAGE_TAG}
          docker run -d -p 8080:8080 --restart unless-stopped --name ci-demo -e SPRING_PROFILES_ACTIVE=prod \
          -e DATABASE_URL=${DATABASE_URL} \
          -e DATABASE_USERNAME=${DATABASE_USERNAME} \
          -e DATABASE_PASSWORD=${DATABASE_PASSWORD} \
          -e JWT_SECRET_KEY=${JWT_SECRET_KEY} \
          -e JWT_ACCESS_TOKEN_VALIDITY_TIME=${JWT_ACCESS_TOKEN_VALIDITY_TIME} \
          -e JWT_REFRESH_TOKEN_VALIDITY_TIME=${JWT_REFRESH_TOKEN_VALIDITY_TIME} \
          -e SERVER_PORT=${SERVER_PORT} \
          -e REDIS_HOST=${REDIS_HOST} \
          -e REDIS_PORT=${REDIS_PORT} \
          -e REDIS_USERNAME=${REDIS_USERNAME} \
          -e REDIS_PASSWORD=${REDIS_PASSWORD} \
          -e GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID} \
          -e GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET} \
          -e PORTONE_API_SECRET=${PORTONE_API_SECRET} \
          -e PORTONE_STORE_ID=${PORTONE_STORE_ID} \
          -e PORTONE_CHANNEL_KG=${PORTONE_CHANNEL_KG} \
          -e PORTONE_CHANNEL_TOSS=${PORTONE_CHANNEL_TOSS} \
          -e BASE_URL=${BASE_URL} \
          ${ECR_URI}:${IMAGE_TAG}
          
          USERDATA
          )

          NEW_VERSION=$(aws ec2 create-launch-template-version \
            --launch-template-id ${LAUNCH_TEMPLATE_ID} \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"${USER_DATA}\"}" \
            --query 'LaunchTemplateVersion.VersionNumber' \
            --output text)

          echo "✅ Launch Template v${NEW_VERSION} 생성 완료"

          aws ec2 modify-launch-template \
            --launch-template-id ${LAUNCH_TEMPLATE_ID} \
            --default-version ${NEW_VERSION}

          echo "✅ 기본 버전 → v${NEW_VERSION} 변경 완료"

      # Step 3: Instance Refresh 시작
      - name: Start Instance Refresh
        id: refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
        run: |
          REFRESH_ID=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${ASG_NAME} \
            --preferences '{
              "MinHealthyPercentage": 100,
              "InstanceWarmup": 120
            }' \
            --query 'InstanceRefreshId' \
            --output text)

          echo "refresh_id=${REFRESH_ID}" >> $GITHUB_OUTPUT
          echo "✅ Instance Refresh 시작: ${REFRESH_ID}"

      # Step 4: Instance Refresh 완료 대기
      - name: Wait for Instance Refresh
        env:
          ASG_NAME: ${{ vars.ASG_NAME }}
          REFRESH_ID: ${{ steps.refresh.outputs.refresh_id }}
        run: |
          echo "⏳ Instance Refresh 완료 대기 중..."

          for i in $(seq 1 30); do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name ${ASG_NAME} \
              --instance-refresh-ids ${REFRESH_ID} \
              --query 'InstanceRefreshes[0].Status' \
              --output text)

            echo "시도 ${i}/30 - 상태: ${STATUS}"

            if [ "${STATUS}" = "Successful" ]; then
              echo "✅ Instance Refresh 성공! 배포 완료!"
              exit 0
            elif [ "${STATUS}" = "Failed" ] || [ "${STATUS}" = "Cancelled" ]; then
              echo "❌ Instance Refresh 실패: ${STATUS}"
              exit 1
            fi

            sleep 30
          done

          echo "❌ Instance Refresh 타임아웃 (15분 초과)"
          exit 1