    <script>
        // 현재 사용자 정보
        let currentUser = null;
        let orders = [];

        // API 목록 동적 생성
        async function populateApiList() {
            const apiListElement = document.getElementById('api-list-orders');
            if (!apiListElement) return;

            try {
                // config 로드 대기
                const config = await getConfig();
                const endpoints = config?.api?.endpoints;

                if (!endpoints) {
                    apiListElement.innerHTML = '';
                    return;
                }

                // orders.html에 필요한 API들
                const requiredApis = ['list-orders', 'create-payment', 'confirm-payment', 'cancel-payment'];
                const apiItems = [];

                requiredApis.forEach(apiKey => {
                    const apiConfig = endpoints[apiKey];
                    if (apiConfig && apiConfig.url) {
                        const method = apiConfig.method || 'GET';
                        const description = apiConfig.description || '';
                        apiItems.push(`<li><code>${method} ${apiConfig.url}</code> - ${description}</li>`);
                    }
                });

                // API가 정의되어 있으면 표시, 없으면 빈 문자열
                apiListElement.innerHTML = apiItems.join('');
            } catch (error) {
                console.error('API 목록 로드 실패:', error);
                apiListElement.innerHTML = '';
            }
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', async () => {
            // API 목록 동적 생성 (비동기)
            populateApiList();


            await loadCurrentUser();
            await loadOrders();
        });

        // 사용자 정보 로드
        async function loadCurrentUser() {
            try {
                currentUser = await makeApiRequest('get-current-user', {
                });

                if (!validateApiResponse('get-current-user', currentUser)) {
                    throw new Error('API 응답 형식이 올바르지 않습니다.');
                }
            } catch (error) {
                console.error('Failed to load user info:', error);
                currentUser = null;
            }
        }

        // 주문 목록 로드
        async function loadOrders() {
            const loadingEl = document.getElementById('order-list-loading');
            const containerEl = document.getElementById('order-list-container');
            const emptyEl = document.getElementById('order-list-empty');

            try {
                const result = await makeApiRequest('list-orders', {
                });

                // YML 스키마 기반 자동 검증
                if (!validateApiResponse('list-orders', result)) {
                    throw new Error('API 응답 형식이 올바르지 않습니다.');
                }

                orders = result;
                loadingEl.style.display = 'none';

                if (orders.length === 0) {
                    emptyEl.style.display = 'block';
                } else {
                    containerEl.style.display = 'block';
                    renderOrderList();
                }
            } catch (error) {
                console.error('Failed to load orders:', error);
                loadingEl.innerHTML = '<span style="color: var(--danger);">주문 목록을 불러오는데 실패했습니다.</span>';
            }
        }

        // 주문 목록 렌더링
        function renderOrderList() {
            const tbody = document.getElementById('order-list-body');
            tbody.innerHTML = '';

            orders.forEach(order => {
                const tr = document.createElement('tr');
                tr.style.borderBottom = '1px solid var(--border)';

                // 상태에 따른 스타일
                const statusStyle = getStatusStyle(order.status);

                // 포인트 정보 구성
                const usedPoints = order.usedPoints || 0;
                const earnedPoints = order.earnedPoints || 0;
                const finalAmount = order.finalAmount || order.totalAmount;

                let pointsDisplay = '';
                if (usedPoints > 0 || earnedPoints > 0) {
                    pointsDisplay = '<div style="font-size: 0.875rem;">';
                    if (usedPoints > 0) {
                        pointsDisplay += `<div style="color: var(--danger);">-${usedPoints.toLocaleString()}P</div>`;
                    }
                    if (earnedPoints > 0) {
                        pointsDisplay += `<div style="color: var(--success);">+${earnedPoints.toLocaleString()}P</div>`;
                    }
                    pointsDisplay += '</div>';
                } else {
                    pointsDisplay = '<span style="color: var(--text-secondary); font-size: 0.875rem;">-</span>';
                }

                tr.innerHTML = `
                    <td style="padding: 0.75rem; font-weight: 600;">
                        <a href="#" onclick="showOrderDetail('${order.orderId}')"
                           style="
                            display: inline-block;
                            padding: 4px 10px;
                            background: rgba(77, 171, 255, 0.05); /* 은은한 푸른빛 배경 */
                            color: #4dabff; /* 네온 블루 */
                            text-decoration: none;
                            border: 1px solid rgba(77, 171, 255, 0.2);
                            border-radius: 4px;
                            transition: all 0.2s ease;
                            letter-spacing: 0.5px;
                            box-shadow: 0 0 5px rgba(77, 171, 255, 0.1);
                           "
                           onmouseover="this.style.background='rgba(77, 171, 255, 0.15)'; this.style.boxShadow='0 0 12px rgba(77, 171, 255, 0.4)'; this.style.color='#fff';"
                           onmouseout="this.style.background='rgba(77, 171, 255, 0.05)'; this.style.boxShadow='0 0 5px rgba(77, 171, 255, 0.1)'; this.style.color='#4dabff';"
                        >
                            ${order.orderNumber}
                        </a>
                    </td>
                    <td style="padding: 0.75rem; font-family: monospace; font-size: 0.875rem; color: var(--text-secondary);">${order.orderId}</td>
                    <td style="padding: 0.75rem;">
                        <div style="font-weight: 600;">${order.totalAmount.toLocaleString()}원</div>
                        ${usedPoints > 0 ? `<div style="font-size: 0.75rem; color: var(--text-secondary);">실결제: ${finalAmount.toLocaleString()}원</div>` : ''}
                    </td>
                    <td style="padding: 0.75rem;">
                        ${pointsDisplay}
                    </td>
                    <td style="padding: 0.75rem;">
                        <span id="order-status${order.orderId}" style="display: inline-block; padding: 0.25rem 0.75rem; border-radius: 4px; font-size: 0.875rem; font-weight: 500; ${statusStyle}">
                            ${getStatusText(order.status)}
                        </span>
                    </td>
                    <td style="padding: 0.75rem; text-align: center;">
                        ${order.status === 'PENDING' ?
                            `<button class="btn btn-primary" style="padding: 0.5rem 1rem; font-size: 0.875rem;" onclick="payOrder('${order.orderId}', ${finalAmount})">
                                💳 결제하기
                            </button>` :
                            `<span style="color: var(--text-secondary); font-size: 0.875rem;">-</span>`
                        }
                    </td>
                `;

                tbody.appendChild(tr);
            });
        }

        // 주문 결제하기
        async function payOrder(orderId, totalAmount) {
            if (!currentUser) {
                showNotification('⚠️ 사용자 정보를 먼저 로드해주세요', 'warning');
                return;
            }

            // 해당 주문 찾기
            const order = orders.find(o => o.orderId === orderId);
            if (!order) {
                showNotification('⚠️ 주문을 찾을 수 없습니다', 'error');
                return;
            }

            try {
                const paymentData = {
                    orderId: orderId,
                    orderName: `주문 ${order.orderNumber}`,  // 주문 번호로 표시
                    totalAmount: totalAmount,
                    currency: 'KRW',
                    payMethod: 'CARD',
                    customer: {
                        customerId: currentUser.customerUid,  // PortOne에 전달할 고객 UID
                        fullName: currentUser.name,
                        phoneNumber: currentUser.phone || '01012345678',  // KG 이니시스 필수
                        email: currentUser.email
                    }
                };

                const result = await openPortOnePayment(paymentData);

                if (result.paymentId) {
                    // 결제 완료 후 모드 B에 자동 입력
                    document.getElementById('manual-payment-id').value = result.paymentId;

                    showNotification('💳 결제 완료! 아래에서 결제 확정/취소를 테스트할 수 있습니다.', 'success');

                    // 주문 목록 새로고침
                    await loadOrders();
                    const es = new EventSource("https://if7down8up.click/api/webhooks/sse?paymentId="+result.paymentId);
                    es.addEventListener("payment", (event) => {
                        // const data = JSON.parse(event.data);
                        // const status = document.getElementById('order-status'+data.orderId);
                        // status.textContent = getStatusText(data.status);
                        // setStatusStyle(status, data.status);
                        // console.log("결제 이벤트:", data.orderId + data.status);
                        loadOrders(); // 주문 목록 새로고침
                    });
                }
            } catch (error) {
                console.error('Payment failed:', error);
            }
        }

        // 모드 B: 수동 결제 확정
        async function manualConfirmPayment() {
            const paymentId = document.getElementById('manual-payment-id').value.trim();

            if (!paymentId) {
                showNotification('⚠️ 결제 ID를 입력해주세요', 'warning');
                return;
            }

            try {
                await confirmPaymentTemplate(paymentId);
                await loadOrders(); // 주문 목록 새로고침
            } catch (error) {
                console.error('Failed to confirm payment:', error);
            }
        }

        // 모드 B: 수동 결제 취소
        async function manualCancelPayment() {
            const paymentId = document.getElementById('manual-payment-id').value.trim();

            if (!paymentId) {
                showNotification('⚠️ 결제 ID를 입력해주세요', 'warning');
                return;
            }

            if (!confirm('정말 이 결제를 취소하시겠습니까?')) {
                return;
            }

            try {
                await cancelPaymentTemplate(paymentId, 'Customer request');
                await loadOrders(); // 주문 목록 새로고침
            } catch (error) {
                console.error('Failed to cancel payment:', error);
            }
        }
        function setStatusStyle(el, status) {
            if (status === "PENDING") {
                el.style.backgroundColor = "#FEF3C7";
                el.style.color = "#92400E";
            } else if((status === "PAID")){
                el.style.backgroundColor = "#D1FAE5";
                el.style.color = "#065F46";
            }else if((status === "CANCELLED")){
                el.style.backgroundColor = "#FEE2E2";
                el.style.color = "#991B1B";
            }else if((status === "SHIPPED")){
                el.style.backgroundColor = "#DBEAFE";
                el.style.color = "#1E40AF";
            }else if((status === "DELIVERED")){
                el.style.backgroundColor = "#E0E7FF";
                el.style.color = "#3730A3";
            }
        }

        // 상태 스타일 반환
        function getStatusStyle(status) {
            const styles = {
                'PENDING': 'background: #FEF3C7; color: #92400E;',
                'PAID': 'background: #D1FAE5; color: #065F46;',
                'REFUNDED': 'background: #D1FAE5; color: #065F46;',
                'CANCELLED': 'background: #FEE2E2; color: #991B1B;',
                'SHIPPED': 'background: #DBEAFE; color: #1E40AF;',
                'DELIVERED': 'background: #E0E7FF; color: #3730A3;'
            };
            return styles[status] || 'background: #F3F4F6; color: #374151;';
        }

        // 상태 텍스트 반환
        function getStatusText(status) {
            const texts = {
                'PENDING': '결제 대기',
                'PAID': '결제 완료',
                'REFUNDED': '환불 완료',
                'CANCELLED': '취소됨',
                'SHIPPED': '배송중',
                'DELIVERED': '배송 완료'
            };
            return texts[status] || status;
        }

        async function showOrderDetail(orderId) {

                const result = await makeApiRequest('get-order-detail', {
                    pathParams: { orderId: orderId }
                });

                const o = result;

                // 주문 상품 목록
                const itemRows = o.items ? o.items.map(item => `
            <tr style="border-bottom: 1px solid var(--border);">
                <td style="padding: 0.5rem;">${item.productName}</td>
                <td style="padding: 0.5rem;">${item.quantity}개</td>
                <td style="padding: 0.5rem;">${item.productPrice.toLocaleString()}원</td>
            </tr>
        `).join('') : '';

                document.getElementById('order-modal-content').innerHTML = `
            <div style="font-family: 'Pretendard', sans-serif; color: #d1d1d1; max-width: 500px;
                /* 상단(연함) -> 중앙(진함) -> 하단(연함) 확실한 대비 */
                background: linear-gradient(180deg,
                    var(--bg-secondary) 0%,
                    var(--bg-primary) 25%,
                    var(--bg-primary) 55%,
                    var(--bg-secondary) 100%);
                border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); overflow: hidden; border: 1px solid rgba(255,255,255,0.05);">

                <div style="padding: 24px; border-bottom: 1px dashed rgba(255,255,255,0.08);">
                    <h2 style="margin: 0 0 8px 0; font-size: 1.25rem; font-weight: 700; color: #ffffff; text-shadow: 0 0 10px rgba(255,255,255,0.1);">주문 상세 정보</h2>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span style="font-size: 0.85rem; color: #888;">번호: ${o.orderNumber}</span>
                        <span style="background: rgba(var(--primary-rgb, 0, 123, 255), 0.1); color: var(--primary); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: 600; border: 1px solid var(--primary);">
                            ${getStatusText(o.status)}
                        </span>
                    </div>
                </div>

                <div style="padding: 24px;">
                    <h3 style="margin: 0 0 16px 0; font-size: 1rem; font-weight: 600; display: flex; align-items: center; gap: 6px; color: #eee; opacity: 0.9;">
                        <span>📦</span> 주문 상품
                    </h3>

                    <div style="display: flex; flex-direction: column; gap: 12px;">
                        ${o.items.map(item => `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.03);">
                                <div style="flex: 1;">
                                    <div style="font-weight: 500; font-size: 0.95rem; margin-bottom: 4px; color: #efefef;">${item.productName}</div>
                                    <div style="font-size: 0.85rem; color: #777;">${item.quantity}개</div>
                                </div>
                                <div style="font-weight: 600; font-size: 0.95rem; color: #fff;">${item.productPrice.toLocaleString()}원</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div style="padding: 24px 24px 16px 24px; border-top: 1px solid rgba(255,255,255,0.05);">
                    <div style="display: flex; flex-direction: column; gap: 10px;">
                        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #888;">
                            <span>주문 총액</span>
                            <span style="color: #bbb;">${o.totalAmount.toLocaleString()}원</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #888;">
                            <span>사용 포인트</span>
                            <span style="color: #ff6b6b; font-weight: 500;">- ${o.usedPoints ? o.usedPoints.toLocaleString() : 0}P</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: #888;">
                            <span>적립 포인트</span>
                            <span style="color: var(--primary); font-weight: 500;">+ ${o.earnedPoints ? o.earnedPoints.toLocaleString() : 0}P</span>
                        </div>

                        <hr style="border: none; border-top: 1px solid rgba(255,255,255,0.05); margin: 8px 0;">

                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <span style="font-weight: 700; font-size: 1rem; color: #fff;">최종 결제 금액</span>
                            <span style="font-weight: 800; font-size: 1.35rem; color: #ff4d4d; text-shadow: 0 0 15px rgba(255, 77, 77, 0.3);">
                                ${o.finalAmount ? o.finalAmount.toLocaleString() : o.totalAmount.toLocaleString()}원
                            </span>
                        </div>
                    </div>

                    <div style="padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.03); text-align: center;">
                        <div style="font-size: 0.75rem; color: #555; font-family: monospace; letter-spacing: 0.5px;">
                            주문일시: ${o.createdAt}
                        </div>
                    </div>
                </div>
            </div>
        `;
                document.getElementById('order-modal').style.display = 'block';
            } catch (error) {
                console.error('주문 상세 조회 실패:', error);
            }
        }

        function closeOrderModal() {
            document.getElementById('order-modal').style.display = 'none';
        }
    </script>
</body>
</html>
