spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # .env 또는 환경변수로 override 가능, 기본값 local
  application:
    name: PaymentApp

  # 클라이언트 API 계약 설정 파일 import
  config:
    import: optional:classpath:client-api-config.yml

  security:
    user:
      name: demo
      password: demo123
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
server:
  port: 8080

# PortOne Configuration
portone:
  api:
    base-url: https://api.portone.io
    secret: ${PORTONE_API_SECRET}
  store:
    id: ${PORTONE_STORE_ID}
  channel:
    kg-inicis: ${PORTONE_CHANNEL_KG}
    toss: ${PORTONE_CHANNEL_TOSS}
  webhook:
    secret: ${PORTONE_WEBHOOK_SECRET}

# JWT Configuration
jwt:
  secret-key: ${JWT_SECRET_KEY}
  access-token-validity-time: 1209600000 # 1시간 (ms) 개발 기간에는 14일로 해놓음
  refresh-token-validity-time: 1209600000 # 7일 (ms) 개발 기간에는 14일로 해놓음

# UI Branding Configuration
app:
  ui:
    branding:
      app-name: CommerceHub
      tagline: 통합 커머스 플랫폼
      logo-text: 🏪 CommerceHub

logging:
  level:
    com.bootcamp.paymentdemo: DEBUG
    org.springframework.security: INFO
