spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}  # .env 또는 환경변수로 override 가능, 기본값 local
  application:
    name: PaymentApp

  # 클라이언트 API 계약 설정 파일 import
  config:
    import: optional:classpath:client-api-config.yml

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8

  security:
    user:
      name: demo
      password: demo123

server:
  port: 8080
  servlet:
    context-path: /

# PortOne Configuration
portone:
  api:
    base-url: https://api.portone.io
    secret: ${PORTONE_API_SECRET:your-api-secret}
  store:
    id: ${PORTONE_STORE_ID:your-store-id}
  channel:
    kg-inicis: ${PORTONE_CHANNEL_KG:your-kg-inicis-channel-key}
    toss: ${PORTONE_CHANNEL_TOSS:your-toss-channel-key}
# JWT Configuration
jwt:
  secret-key: ${JWT_SECRET_KEY:L6h/xMxGO53HQmR/OB99qR/y0kTr2CAyaI5RqBIX184=}
  access-token-validity-time: 3600000    # 1시간 (ms)
  refresh-token-validity-time: 604800000 # 7일 (ms)

# UI Branding Configuration
app:
  ui:
    branding:
      app-name: CommerceHub
      tagline: 통합 커머스 플랫폼
      logo-text: 🏪 CommerceHub

logging:
  level:
    com.bootcamp.paymentdemo: DEBUG
    org.springframework.security: INFO
